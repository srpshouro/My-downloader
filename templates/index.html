<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Downloader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #111111; --bg-card: #1a1a1a;
            --text-primary: #ffffff; --text-secondary: #a3a3a3;
            --accent: #8b5cf6; --accent-hover: #7c3aed;
            --success: #10b981; --error: #ef4444; --border-light: #262626;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 600px; padding: 2.5rem; background: var(--glass); border-radius: 1.5rem; border: 1px solid var(--border-light); text-align: center; }
        .title { font-size: 2.5rem; color: var(--accent); margin-bottom: 0.5rem; font-weight: bold; }
        .input-field { width: 100%; box-sizing: border-box; padding: 1.2rem; border-radius: 1rem; border: 1px solid var(--border-light); background: var(--bg-secondary); color: white; margin-bottom: 1.5rem; font-size: 1rem; outline: none; }
        .btn { background: var(--accent); color: white; border: none; padding: 1.2rem; border-radius: 1rem; font-size: 1.1rem; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem; display: none; }
        .success-box { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); }
        .error-box { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid var(--error); }
        .download-btn-green { display: inline-block; background: var(--success); color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">All-in-One Downloader</div>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Powered by Custom API</p>
        
        <input type="url" id="video-url" class="input-field" placeholder="Paste YouTube, TikTok or FB link here..." />
        
        <button class="btn" id="download-btn" onclick="fetchFromMyAPI()">
            <span id="btn-text">Get Download Link</span>
        </button>
        
        <div id="status-box" class="status"></div>
    </div>

    <script>
        async function fetchFromMyAPI() {
            const urlInput = document.getElementById('video-url').value.trim();
            const btn = document.getElementById('download-btn');
            const btnText = document.getElementById('btn-text');
            const statusBox = document.getElementById('status-box');

            if (!urlInput) {
                showStatus('Please paste a link first!', 'error');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '⏳ Processing with API...';
            statusBox.style.display = 'none';

            try {
                // 🚀 আপনার নিজের API তে রিকোয়েস্ট পাঠানো হচ্ছে
                const response = await fetch(`/alldown?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data.status === true) {
                    const finalLink = data.watermark_free_video || data.download_link;
                    
                    statusBox.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        Platform: ${data.platform}<br>
                        <a href="${finalLink}" class="download-btn-green" target="_blank" rel="noopener noreferrer">⬇️ Click to Download</a>
                    `;
                    statusBox.className = 'status success-box';
                    statusBox.style.display = 'block';
                } else {
                    showStatus(`❌ API Error: ${data.message}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Network Error!`, 'error');
            } finally {
                btn.disabled = false;
                btnText.innerHTML = 'Get Download Link';
            }
        }

        function showStatus(message, type) {
            const box = document.getElementById('status-box');
            box.innerHTML = message;
            box.className = `status ${type === 'error' ? 'error-box' : 'success-box'}`;
            box.style.display = 'block';
        }
    </script>
</body>
</html>
