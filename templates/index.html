<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Media Downloader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; max-width: 500px; width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 30px; text-align: center; }
        .header { margin-bottom: 25px; }
        .header h1 { color: #4a4a4a; font-size: 24px; margin-bottom: 10px; }
        .header p { color: #777; font-size: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 16px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #667eea; }
        button.fetch-btn { background: #667eea; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; width: 100%; }
        button.fetch-btn:hover { background: #5a6fe0; }
        
        /* Loader */
        .loader { display: none; margin: 20px 0; font-weight: bold; color: #667eea; }
        .loader i { animation: spin 2s linear infinite; font-size: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results Section */
        .result-box { display: none; margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
        .thumbnail { width: 100%; border-radius: 8px; margin-bottom: 15px; object-fit: cover; max-height: 250px; }
        .video-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 15px; word-wrap: break-word; }
        
        /* Download Buttons */
        .download-btns { display: flex; flex-direction: column; gap: 10px; }
        .dl-btn { text-decoration: none; display: flex; justify-content: space-between; align-items: center; background: #28a745; color: white; padding: 12px 15px; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
        .dl-btn:hover { background: #218838; }
        .dl-btn.audio { background: #ffc107; color: #333; }
        .dl-btn.audio:hover { background: #e0a800; }
        
        .error-msg { color: red; font-weight: bold; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-cloud-download-alt"></i> All Media Downloader</h1>
        <p>Download Videos from Instagram, YouTube, Facebook & TikTok</p>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Paste your video link here...">
        <button class="fetch-btn" onclick="fetchVideo()">Get Download Links</button>
    </div>

    <!-- Loading Animation -->
    <div class="loader" id="loader">
        <i class="fas fa-spinner"></i> <br><br>Processing video... Please wait.
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg">Failed to fetch video. Check link or try again.</div>

    <!-- Result Area -->
    <div class="result-box" id="resultBox">
        <img src="" id="thumb" class="thumbnail" alt="Video Thumbnail">
        <div class="video-title" id="title">Video Title</div>
        
        <div class="download-btns" id="downloadBtns">
            <!-- Buttons will be generated here by JavaScript -->
        </div>
    </div>
</div>

<script>
    async function fetchVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        if (!urlInput) {
            alert('Please enter a valid video URL!');
            return;
        }

        // UI Updates
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('downloadBtns').innerHTML = '';

        // Tumar Render API Link
        const apiUrl = `https://all-media-api-1.onrender.com/api/download?url=${encodeURIComponent(urlInput)}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            document.getElementById('loader').style.display = 'none';

            if (data.success) {
                // Show Result Box
                document.getElementById('resultBox').style.display = 'block';
                
                // Set Thumbnail and Title
                document.getElementById('thumb').src = data.thumbnail || 'https://via.placeholder.com/500x250?text=No+Thumbnail';
                document.getElementById('title').innerText = data.title;

                // Create Download Buttons
                const links = data.links;
                const btnContainer = document.getElementById('downloadBtns');

                // Helper function to create buttons
                const createBtn = (label, url, isAudio = false) => {
                    if(url && url !== "Not Found") {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank'; // Opens link in new tab to download/play
                        a.className = `dl-btn ${isAudio ? 'audio' : ''}`;
                        a.innerHTML = `<span>${label}</span> <i class="fas fa-download"></i>`;
                        btnContainer.appendChild(a);
                    }
                };

                // Add Buttons (360p, 480p, 720p, Audio)
                // Removing duplicates (karon Instagram e eki link ashte pare)
                const uniqueLinks = new Set();

                const addUniqueBtn = (label, url, isAudio) => {
                    if (url && url !== "Not Found" && !uniqueLinks.has(url)) {
                        uniqueLinks.add(url);
                        createBtn(label, url, isAudio);
                    }
                };

                addUniqueBtn('Download 720p (Best)', links['720p'], false);
                addUniqueBtn('Download 480p', links['480p'], false);
                addUniqueBtn('Download 360p', links['360p'], false);
                
                // Audio button
                if (links['audio_high'] && links['audio_high'] !== "Not Found") {
                    createBtn('Download Audio (MP3/M4A)', links['audio_high'], true);
                }

            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('errorMsg').innerText = data.error || "Failed to find video.";
            }
        } catch (error) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerText = "Server Error. Please wait or check your network.";
        }
    }
</script>

</body>
</html>
