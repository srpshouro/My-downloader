<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Social Media Downloader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #111111; --bg-card: #1a1a1a;
            --text-primary: #ffffff; --text-secondary: #a3a3a3; --text-muted: #666666;
            --accent: #8b5cf6; --accent-hover: #7c3aed; --success: #10b981;
            --error: #ef4444; --warning: #f59e0b; --border: #333333; --border-light: #262626;
            --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .background-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(120, 219, 255, 0.15) 0%, transparent 50%);
            pointer-events: none; z-index: -1; animation: backgroundFloat 20s ease-in-out infinite;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(10px) rotate(-1deg); }
        }

        .floating-icons { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; overflow: hidden; }
        .floating-icon { position: absolute; opacity: 0.03; animation: float 15s linear infinite; font-size: 2rem; }
        .floating-icon:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 20s; }
        .floating-icon:nth-child(2) { left: 30%; animation-delay: 4s; animation-duration: 22s; }
        .floating-icon:nth-child(3) { left: 50%; animation-delay: 8s; animation-duration: 24s; }
        .floating-icon:nth-child(4) { left: 70%; animation-delay: 12s; animation-duration: 21s; }
        .floating-icon:nth-child(5) { left: 90%; animation-delay: 14s; animation-duration: 17s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.03; }
            90% { opacity: 0.03; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .container { max-width: 900px; margin: 0 auto; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { text-align: center; margin-bottom: 3rem; padding-top: 2rem; }
        .logo { font-size: 3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), #ec4899, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .tagline { font-size: 1.125rem; color: var(--text-secondary); }

        .card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 1.5rem; padding: 2rem; transition: all 0.3s ease; }
        .card:hover { border-color: var(--border); background: rgba(255, 255, 255, 0.08); }

        .input-group { margin-bottom: 1.5rem; }
        .input-label { display: block; margin-bottom: 0.75rem; color: var(--text-primary); font-weight: 500; }
        .input-field { width: 100%; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 1rem; padding: 1rem 1.25rem; color: var(--text-primary); font-size: 1rem; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: var(--accent); background: var(--bg-secondary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }

        .btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; border: none; border-radius: 1rem; padding: 1rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); text-decoration: none; width: auto; padding: 0.8rem 1.5rem; }
        .btn-success:hover { box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); }

        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255, 255, 255, 0.3); border-top: 2px solid white; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .result-card { margin-top: 1.5rem; padding: 1.5rem; background: var(--bg-secondary); border-radius: 1rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-image { width: 120px; border-radius: 0.5rem; object-fit: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .result-info { flex: 1; }
        .result-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary); word-break: break-word; }
        .result-meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem; text-transform: capitalize; }
        
        .error-msg { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--error); color: var(--error); }

    </style>
</head>
<body>
    <div class="background-gradient"></div>
    <div class="floating-icons">
        <div class="floating-icon">📺</div>
        <div class="floating-icon">📸</div>
        <div class="floating-icon">🎵</div>
        <div class="floating-icon">🐦</div>
        <div class="floating-icon">📱</div>
    </div>
    
    <div class="container">
        <header class="header">
            <h1 class="logo">Fast Downloader</h1>
            <p class="tagline">Directly get download links from any social media</p>
        </header>

        <main class="main-content">
            <div class="card">
                <div class="input-group">
                    <label class="input-label">Paste Video/Post URL</label>
                    <input type="url" id="single-url" class="input-field" placeholder="https://www.youtube.com/watch?v=... OR Instagram/TikTok link" />
                </div>
                
                <button class="btn" onclick="downloadSingle()" id="download-btn">
                    <span id="single-spinner" class="spinner"></span>
                    <span id="btn-text">Generate Download Link</span>
                </button>
                
                <div id="status-container"></div>
            </div>
        </main>
    </div>

    <script>
        async function downloadSingle() {
            const url = document.getElementById('single-url').value.trim();
            const statusDiv = document.getElementById('status-container');
            const button = document.getElementById('download-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('single-spinner');
            
            if (!url) {
                statusDiv.innerHTML = `<div class="error-msg">❌ Please enter a valid URL</div>`;
                return;
            }
            
            // Loading State
            spinner.style.display = 'block';
            btnText.textContent = 'Extracting link from server...';
            button.disabled = true;
            statusDiv.innerHTML = '';
            
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusDiv.innerHTML = `
                        <div class="result-card">
                            ${result.thumbnail ? `<img src="${result.thumbnail}" class="result-image" alt="Thumbnail">` : ''}
                            <div class="result-info">
                                <h3 class="result-title">${result.title}</h3>
                                <p class="result-meta">🌐 Platform: ${result.platform}</p>
                                <a href="${result.download_url}" target="_blank" rel="noopener noreferrer" class="btn btn-success">
                                    ⬇️ Download Video
                                </a>
                            </div>
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `<div class="error-msg">❌ ${result.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="error-msg">❌ Network error: Could not connect to server.</div>`;
            } finally {
                spinner.style.display = 'none';
                btnText.textContent = 'Generate Download Link';
                button.disabled = false;
            }
        }

        // Enter press support
        document.getElementById('single-url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') downloadSingle();
        });
    </script>
</body>
</html>
