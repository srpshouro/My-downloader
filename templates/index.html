<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Downloader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --bg-primary: #0a0a0a; --bg-secondary: #111111; --bg-card: #1a1a1a;
            --text-primary: #ffffff; --text-secondary: #a3a3a3;
            --accent: #8b5cf6; --accent-hover: #7c3aed;
            --success: #10b981; --error: #ef4444; --border-light: #262626;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 4rem auto; padding: 2rem; background: var(--glass); border-radius: 1.5rem; border: 1px solid var(--border-light); text-align: center; }
        .title { font-size: 2.5rem; color: var(--accent); margin-bottom: 0.5rem; font-weight: bold; }
        .input-field { width: 90%; padding: 1rem; border-radius: 1rem; border: 1px solid var(--border-light); background: var(--bg-secondary); color: white; margin-bottom: 1rem; font-size: 1rem; }
        .btn { background: var(--accent); color: white; border: none; padding: 1rem 2rem; border-radius: 1rem; font-size: 1rem; cursor: pointer; transition: 0.3s; width: 95%; font-weight: bold; }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 1.5rem; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Downloader</div>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Download videos directly to your device</p>
        
        <input type="url" id="video-url" class="input-field" placeholder="Paste YouTube, TikTok or FB link here..." />
        
        <button class="btn" id="download-btn" onclick="startDownload()">
            <span id="btn-text">Download Now</span>
        </button>
        
        <div id="status-container" class="status"></div>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('video-url').value.trim();
            const statusDiv = document.getElementById('status-container');
            const button = document.getElementById('download-btn');
            const btnText = document.getElementById('btn-text');
            
            if (!url) {
                statusDiv.innerHTML = `<span style="color: var(--error);">Please enter a valid URL</span>`;
                return;
            }
            
            btnText.textContent = 'Processing... Please wait';
            button.disabled = true;
            statusDiv.innerHTML = '';
            
            try {
                const response = await fetch('/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusDiv.innerHTML = `<span style="color: var(--success);">✅ Found it! Downloading: ${result.title}...</span>`;
                    
                    // এই লাইনটি ব্রাউজারকে ফাইলটি ফিজিক্যালি ফোনে ডাউনলোড করতে বাধ্য করবে
                    window.location.href = result.proxy_url; 
                } else {
                    statusDiv.innerHTML = `<span style="color: var(--error);">❌ Error: ${result.message}</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span style="color: var(--error);">❌ Network error occurred!</span>`;
            } finally {
                setTimeout(() => {
                    btnText.textContent = 'Download Now';
                    button.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
